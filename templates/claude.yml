# ai-otonom tarafından yönetilir — elle düzenlemeyin.
# Mantık merkezi depoda: https://github.com/{{CENTRAL_REPO}}
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: {{CENTRAL_REPO}}/.github/workflows/claude-mention.yml@{{CENTRAL_REF}}
    with:
      language: "{{LANGUAGE}}"
    secrets: inherit
