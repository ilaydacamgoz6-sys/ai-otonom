# ai-otonom tarafından yönetilir — elle düzenlemeyin.
# Mantık merkezi depoda: https://github.com/{{CENTRAL_REPO}}
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: {{CENTRAL_REPO}}/.github/workflows/claude-review.yml@{{CENTRAL_REF}}
    with:
      language: "{{LANGUAGE}}"
    secrets: inherit
